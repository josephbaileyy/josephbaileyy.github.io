<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 5 - Music Scene Dev Harness</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #120d0b;
      color: #f2ede6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    h1 {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: #7f8ea3;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .harness-container {
      width: 100%;
      max-width: 900px;
      border: 1px solid rgba(242, 237, 230, 0.1);
      border-radius: 8px;
      background: rgba(18, 13, 11, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    #scene-root {
      width: 100%;
      height: 380px;
    }

    .slider-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #7f8ea3;
      letter-spacing: 0.05em;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    input[type="range"] {
      flex-grow: 1;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(242, 237, 230, 0.1);
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffb547;
      box-shadow: 0 0 6px rgba(255, 181, 71, 0.6);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .val-display {
      min-width: 50px;
      text-align: right;
      color: #ffb547;
    }
  </style>
</head>
<body>

  <h1>Chapter 5 — Music Scene (Dev Harness)</h1>

  <div class="harness-container">
    <div id="scene-root"></div>
  </div>

  <div class="slider-container">
    <div class="slider-row">
      <label for="progress-slider">onProgress(p)</label>
      <input type="range" id="progress-slider" min="0" max="1" step="0.005" value="0">
      <span class="val-display" id="progress-val">0.000</span>
    </div>
  </div>

  <script type="module">
    import { createScene } from './index.js';

    const root = document.getElementById('scene-root');
    const slider = document.getElementById('progress-slider');
    const valDisplay = document.getElementById('progress-val');

    // Initialize scene
    const scene = createScene(root, {
      reducedMotion: false,
      audioUrl: '../../assets/audio/solo.m4a',
      peaksUrl: '../../assets/audio/solo-peaks.json'
    });

    // Handle progress slider input
    slider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      valDisplay.textContent = val.toFixed(3);
      scene.onProgress(val);
    });

    // Trigger initial progress state
    scene.onProgress(0);

    // Expose scene to window for console/headless inspection
    window.scene = scene;
  </script>

</body>
</html>
