<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Joseph Bailey</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f1ea" />
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #14161a;
        --ink-soft: #55595f;
        --rule: #d6d1c4;
        --cobalt: #1b46d8;
        --font-display: "Iowan Old Style", Georgia, serif;
        --font-text: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.25rem;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-text);
      }

      main {
        width: min(100%, 42rem);
        padding-block: 3rem;
        border-block: 1px solid var(--rule);
      }

      .code {
        color: var(--ink-soft);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 1rem 0;
        font-family: var(--font-display);
        font-size: clamp(3rem, 10vw, 6rem);
        font-weight: 400;
        line-height: 0.95;
      }

      p {
        max-width: 38rem;
        color: var(--ink-soft);
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        margin-top: 1.5rem;
        padding: 0.7rem 1rem;
        border: 1px solid var(--cobalt);
        color: var(--cobalt);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        text-decoration: none;
        text-transform: uppercase;
      }

      a:hover {
        background: var(--cobalt);
        color: var(--paper);
      }

      a:focus-visible {
        outline: 3px solid var(--cobalt);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 / No measurement</p>
      <h1>Nothing was observed at this address.</h1>
      <p>The requested page is outside this portfolio’s current record.</p>
      <a href="/">Return to the index</a>
    </main>
  </body>
</html>
