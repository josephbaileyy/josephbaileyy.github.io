name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Worldline (the current site) lives in worldline/ with its own vite
      # config; it builds to worldline/dist, which is what gets deployed as
      # the Pages site root. The pre-rebuild "zoomable universe" site's
      # source still lives at repo root for reference but is no longer built
      # or deployed — see the archive/universe-site branch for its last
      # deployed state.
      - run: npx vite build --config worldline/vite.config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: worldline/dist
      - id: deployment
        uses: actions/deploy-pages@v4
