name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The site lives in v4/ and builds to v4/dist; the collision chamber is
      # included at /lab/.
      #
      # Everything fetched at runtime must live under v4/public/: files outside
      # publicDir are never copied by vite build, so fetches 404 in production
      # while the dev server looks perfect. v4/tests/build-output.test.js
      # regression-tests that seam.
      - run: npx vite build --config v4/vite.config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: v4/dist
      - id: deployment
        uses: actions/deploy-pages@v4
