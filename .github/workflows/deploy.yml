name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unit suite covers all versions still in the tree (v4, v3, and the root
      # site). `npm test` excludes tests/e2e/**, which target the v1 root site
      # that is no longer deployed.
      - run: npm test
      # v4 ("The Unfolding Machine") is the current site. It lives in v4/ with
      # its own vite config and builds to v4/dist, which is deployed as the
      # Pages site root. Three earlier versions stay in the tree, built by
      # nothing and deployed by nothing, purely as fallbacks: v3/ (the Event
      # Lens monograph), worldline/ (the scroll-driven physics worldline), and
      # the repo root (the zoomable-universe site, whose last deployed state is
      # on the archive/universe-site branch).
      #
      # Everything fetched at runtime must live under v4/public/. In v3 the JSON
      # sat in v3/data/, outside publicDir, so vite build never copied it: every
      # fetch 404'd in production and the hero silently fell back on every load
      # while the dev server looked perfect. v4/tests/build-output.test.js
      # regression-tests that seam.
      - run: npx vite build --config v4/vite.config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: v4/dist
      - id: deployment
        uses: actions/deploy-pages@v4
