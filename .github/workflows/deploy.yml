name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # v3 ("The Event Lens") is the current site. It lives in v3/ with its own
      # vite config and builds to v3/dist, which is what gets deployed as the
      # Pages site root. Two earlier versions are kept, built by nothing and
      # deployed by nothing, purely as fallbacks: worldline/ (the scroll-driven
      # physics worldline) and the repo root (the zoomable-universe site, whose
      # last deployed state is on the archive/universe-site branch).
      #
      # v3/public/data holds the CMS event and signal JSON. It lives under
      # publicDir deliberately: when that data sat in v3/data it was outside the
      # build, every fetch 404'd in production, and the Event Lens silently
      # degraded to its static fallback on every load while dev looked fine.
      # v3/tests/build-output.test.js regression-tests that seam.
      - run: npx vite build --config v3/vite.config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: v3/dist
      - id: deployment
        uses: actions/deploy-pages@v4
